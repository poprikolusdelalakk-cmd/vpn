<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield VPN — Тарифы</title>
    <style>
        :root { --bg-color: #0a0a12; --panel-bg: rgba(20, 20, 35, 0.65); --neon-cyan: #00f0ff; --neon-magenta: #ff007f; --text-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg-color) 100%); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 1200px; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: var(--text-color); text-decoration: none; margin-left: 25px; font-size: 15px; transition: 0.3s; opacity: 0.7; }
        nav a:hover, nav a.active { opacity: 1; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        
        .price-container { display: flex; gap: 25px; width: 90%; max-width: 800px; margin-top: 50px; justify-content: center; }
        .price-card {
            background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; padding: 35px; width: 100%; max-width: 280px; text-align: center; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .price-card.premium { border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 240, 255, 0.15); }
        .price-card h3 { font-size: 20px; color: #fff; margin-bottom: 15px; }
        .cost { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 20px; }
        .cost span { font-size: 16px; color: #64748b; font-weight: 400; }
        .features { list-style: none; color: #94a3b8; font-size: 14px; margin-bottom: 30px; line-height: 2; }
        .buy-btn {
            display: block; width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
            color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .price-card.premium .buy-btn { background: var(--neon-cyan); color: #000; border: none; font-weight: 700; }
        .price-card.premium .buy-btn:hover { box-shadow: 0 0 20px var(--neon-cyan); }
    </style>
</head>
<body>
    <header>
        <div class="logo">CYBER.VPN</div>
        <nav>
            <a href="index.html">Подключение</a>
            <a href="download.html">Скачать</a>
            <a href="billing.html" class="active">Тарифы</a>
            <a href="support.html">Поддержка</a>
        </nav>
    </header>

    <div class="price-container">
        <div class="price-card">
            <h3>Тест драйв</h3>
            <div class="cost">149₽ <span>/ мес</span></div>
            <ul class="features">
                <li>1 устройство</li>
                <li>Ограничение 50 ГБ</li>
                <li>Локация: Германия</li>
            </ul>
            <a href="#" class="buy-btn">Выбрать</a>
        </div>
        <div class="price-card premium">
            <h3>Cyber Безлимит</h3>
            <div class="cost">299₽ <span>/ мес</span></div>
            <ul class="features">
                <li>5 устройств одновременно</li>
                <li>Безлимитный трафик</li>
                <li>Все локации (4 страны)</li>
                <li>Максимальная скорость</li>
            </ul>
            <a href="#" class="buy-btn">Купить доступ</a>
        </div>
    </div>
</body>
</html>
