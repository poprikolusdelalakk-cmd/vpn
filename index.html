<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield VPN — Главная</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.65);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --text-color: #e2e8f0;
            --power-off: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .bg-glow {
            position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -10%; left: -10%; z-index: -1; filter: blur(80px);
        }
        .bg-glow-2 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.12) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%; right: -10%; z-index: -1; filter: blur(80px);
        }
        header {
            width: 100%; max-width: 1200px; padding: 30px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            font-size: 24px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        nav a {
            color: var(--text-color); text-decoration: none; margin-left: 25px;
            font-size: 15px; letter-spacing: 1px; transition: 0.3s; opacity: 0.7;
        }
        nav a:hover, nav a.active {
            opacity: 1; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);
        }
        .vpn-container {
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px;
            width: 90%; max-width: 450px; padding: 40px 30px; margin-top: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); text-align: center; position: relative;
        }
        .status-box { margin-bottom: 30px; }
        .status-text { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: #64748b; }
        .status-state { font-size: 28px; font-weight: 700; margin-top: 5px; color: #94a3b8; }
        .power-wrapper {
            position: relative; width: 200px; height: 200px;
            margin: 0 auto 40px auto; display: flex; align-items: center; justify-content: center;
        }
        .power-btn {
            width: 160px; height: 160px; border-radius: 50%; background: #1e1e38;
            border: 6px solid #2d2d4d; cursor: pointer; display: flex;
            align-items: center; justify-content: center; position: relative; z-index: 2;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .power-btn svg { width: 60px; height: 60px; fill: none; stroke: var(--power-off); stroke-width: 4; transition: 0.4s; }
        .power-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--neon-cyan); opacity: 0; transform: scale(0.8); pointer-events: none;
        }
        .vpn-container.connected .power-btn {
            border-color: var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 240, 255, 0.4); background: #11293a;
        }
        .vpn-container.connected .power-btn svg { stroke: var(--neon-cyan); filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        .vpn-container.connected .power-ring { animation: pulse-ring 2s infinite; }
        .vpn-container.connected .status-text { color: var(--neon-cyan); }
        .vpn-container.connected .status-state { color: #fff; text-shadow: 0 0 15px var(--neon-cyan); }
        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        .location-selector {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 12px 20px; display: flex; align-items: center;
            justify-content: space-between; cursor: pointer; transition: 0.3s;
        }
        .location-selector:hover { background: rgba(255,255,255,0.08); border-color: rgba(0, 240, 255, 0.3); }
        .flag-info { display: flex; align-items: center; gap: 12px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .info-card { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 12px; font-size: 13px; }
        .info-label { color: #64748b; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; }
        .info-value { font-weight: 600; font-family: monospace; font-size: 14px; }
        .countries-modal {
            position: absolute; bottom: -220px; left: 0; width: 100%;
            background: #131324; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; z-index: 10; display: none; flex-direction: column; overflow: hidden;
        }
        .country-option { padding: 12px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; text-align: left; }
        .country-option:hover { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="bg-glow"></div><div class="bg-glow-2"></div>
    <header>
        <div class="logo">CYBER.VPN</div>
        <nav>
            <a href="index.html" class="active">Главная</a>
            <a href="setup.html">Настройка</a>
            <a href="github.html">GitHub Pages</a>
            <a href="about.html">О проекте</a>
        </nav>
    </header>

    <div class="vpn-container" id="vpnInterface">
        <div class="status-box">
            <div class="status-text" id="statusText">Защита отключена</div>
            <div class="status-state" id="statusState">НЕЗАЩИЩЕН</div>
        </div>
        <div class="power-wrapper">
            <div class="power-ring"></div>
            <button class="power-btn" id="connectBtn">
                <svg viewBox="0 0 24 24"><path d="M12 2v10M18.36 5.64A9 9 0 1 1 5.64 5.64" /></svg>
            </button>
        </div>
        <div class="location-selector" id="locationBtn">
            <div class="flag-info">
                <span id="currentFlag" style="font-size:22px;">🇩🇪</span>
                <span id="currentCountry" class="country-name">Германия (Франкфурт)</span>
            </div>
            <span style="color: #64748b; font-size: 12px;">▼</span>
        </div>
        <div class="countries-modal" id="countriesModal">
            <div class="country-option" data-flag="🇩🇪" data-country="Германия" data-ip="185.244.24.12"><span>🇩🇪</span> Германия</div>
            <div class="country-option" data-flag="🇳🇱" data-country="Нидерланды" data-ip="91.211.89.45"><span>🇳🇱</span> Нидерланды</div>
            <div class="country-option" data-flag="🇫🇮" data-country="Финляндия" data-ip="95.175.99.102"><span>🇫🇮</span> Финляндия</div>
            <div class="country-option" data-flag="🇺🇸" data-country="США (Нью-Йорк)" data-ip="192.241.130.8"><span>🇺🇸</span> США</div>
        </div>
        <div class="info-grid">
            <div class="info-card"><div class="info-label">Твой IP</div><div class="info-value" id="ipAddress">94.25.160.84</div></div>
            <div class="info-card"><div class="info-label">Пинг</div><div class="info-value" id="pingValue">—</div></div>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const vpnInterface = document.getElementById('vpnInterface');
        const statusText = document.getElementById('statusText');
        const statusState = document.getElementById('statusState');
        const ipAddress = document.getElementById('ipAddress');
        const pingValue = document.getElementById('pingValue');
        const locationBtn = document.getElementById('locationBtn');
        const countriesModal = document.getElementById('countriesModal');
        const currentFlag = document.getElementById('currentFlag');
        const currentCountry = document.getElementById('currentCountry');

        const realIP = "94.25.160.84"; 
        let selectedIP = "185.244.24.12"; 
        let isConnected = false;

        connectBtn.addEventListener('click', () => {
            isConnected = !isConnected;
            if (isConnected) {
                vpnInterface.classList.add('connected');
                statusText.textContent = "Защита включена";
                statusState.textContent = "ПОДКЛЮЧЕНО";
                ipAddress.textContent = selectedIP;
                pingValue.textContent = Math.floor(Math.random() * (45 - 15) + 15) + " ms";
            } else {
                vpnInterface.classList.remove('connected');
                statusText.textContent = "Защита отключена";
                statusState.textContent = "НЕЗАЩИЩЕН";
                ipAddress.textContent = realIP;
                pingValue.textContent = "—";
            }
        });

        locationBtn.addEventListener('click', (e) => { e.stopPropagation(); countriesModal.style.display = countriesModal.style.display === 'flex' ? 'none' : 'flex'; });
        document.querySelectorAll('.country-option').forEach(option => {
            option.addEventListener('click', function() {
                currentFlag.textContent = this.getAttribute('data-flag');
currentCountry.textContent = this.getAttribute('data-country');
selectedIP = this.getAttribute('data-ip');
countriesModal.style.display = 'none';
if (isConnected) ipAddress.textContent = selectedIP;
});
});
document.addEventListener('click', () => countriesModal.style.display = 'none');
