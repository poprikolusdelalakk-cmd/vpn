<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield VPN — Поддержка</title>
    <style>
        :root { --bg-color: #0a0a12; --panel-bg: rgba(20, 20, 35, 0.65); --neon-cyan: #00f0ff; --neon-magenta: #ff007f; --text-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg-color) 100%); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; max-width: 1200px; padding: 30px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        nav a { color: var(--text-color); text-decoration: none; margin-left: 25px; font-size: 15px; transition: 0.3s; opacity: 0.7; }
        nav a:hover, nav a.active { opacity: 1; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }
        
        .form-container {
            background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; width: 90%; max-width: 550px; padding: 40px; margin-top: 40px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #fff; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; text-transform: uppercase; color: #64748b; margin-bottom: 8px; letter-spacing: 1px; }
        input, textarea {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; transition: 0.3s; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--neon-magenta); box-shadow: 0 0 10px rgba(255, 0, 127, 0.2); }
        .submit-btn {
            width: 100%; padding: 14px; background: linear-gradient(90deg, var(--neon-magenta), #b30059);
            border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { box-shadow: 0 0 20px var(--neon-magenta); transform: translateY(-1px); }
    </style>
</head>
<body>
    <header>
        <div class="logo">CYBER.VPN</div>
        <nav>
            <a href="index.html">Подключение</a>
            <a href="download.html">Скачать</a>
            <a href="billing.html">Тарифы</a>
            <a href="support.html" class="active">Поддержка</a>
        </nav>
    </header>

    <div class="form-container">
        <h1>Возникли проблемы?</h1>
        <form onsubmit="event.preventDefault(); alert('Сообщение отправлено!');">
            <div class="form-group">
                <label>Твой Email</label>
                <input type="email" placeholder="example@cyber.com" required>
            </div>
            <div class="form-group">
                <label>Суть проблемы</label>
                <textarea rows="5" placeholder="Опиши, что пошло не так (не подключается, упала скорость...)" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Отправить тикет</button>
        </form>
    </div>
</body>
</html>
